<html>
<head>
    <title>Lists Example</title>
</head>
<body>
    <h3>Ordered List</h3>
    <ol>
        <li>Pen</li>
        <li>Pencil</li>
        <li>Eraser</li>
    </ol>

    <h3>Unordered List</h3>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>

    <h3>Description List</h3>
    <dl>
        <dt>HTML</dt>
        <dd>Used to make web pages.</dd>
        <dt>CSS</dt>
        <dd>Used to design web pages.</dd>
    </dl>
</body>
</html>
